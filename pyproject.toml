[project]
name = "tg-personal-assistant"
version = "0.1.0"
description = "Telegram auto-reply assistant for one private dialog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tzdata>=2024.1",
  "edge-tts>=6.1.12,<8.0.0",
  "httpx>=0.27.0,<0.29.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "python-telegram-bot>=21.10,<22.0",
  "telethon>=1.38.1,<2.0.0",
  "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
tg-personal-assistant = "tg_personal_assistant.main:main"
tg-personal-bootstrap-secrets = "tg_personal_assistant.bootstrap:bootstrap_secrets_main"
tg-personal-list-dialogs = "tg_personal_assistant.bootstrap:list_dialogs_main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
